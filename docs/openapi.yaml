        "200":
          description: Sucesso
        "400":
          description: Entrada inválida
        "401":
          description: Sem sessão
        "403":
          description: Sem capability contextual
        "404":
          description: Recurso indisponível
        "409":
          description: Estado ou integridade incompatível
        "413":
          description: Limite de upload
        "415":
          description: MIME/decode inválido
        "429":
          description: Limite operacional
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
