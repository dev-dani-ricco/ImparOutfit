                    - categoryConfirmed
                  properties:
                    complete:
                      type: boolean
                    isolatedItem:
                      type: boolean
                    colorFaithful:
                      type: boolean
                    categoryConfirmed:
                      type: boolean
                    manualCorrection:
                      type: boolean
                dimension:
                  type: object
                  required:
                    - axis
                    - valueMeters
                    - source
                  properties:
                    axis:
                      type: string
                      enum:
                        - x
                        - y
                        - z
                    valueMeters:
                      type: number
                      minimum: 0.001
                      maximum: 5
                    source:
                      type: string
                      enum:
                        - USER_DECLARED
                        - MERCHANT_DECLARED
