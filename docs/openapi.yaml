openapi: 3.0.3
info:
  title: UNIVERSO ÍMPAR — Fundação contextual
  version: 2.0.0
  description: CICLO 1. Authentication identifica Account/Person; Authorization
    consulta Membership/Capability/Grant e recurso. JWT HS256, issuer
    universo-impar, audience universo-impar-app, duração 1 hora, versão
    revogável. Tokens legados exigem novo login. Upload JPEG/PNG/WebP até 5 MiB
    cada, quatro arquivos, 20 MP; reencode privado. Commercial Product ≠ Owned
    Wardrobe Item.
servers:
  - url: /api
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          description: Canonical private error envelope.
          type: object
          required:
            - code
            - message
            - requestId
            - details
          properties:
            code:
              type: string
              description: Stable UPPER_SNAKE_CASE error code.
            message:
              type: string
              description: Safe client-facing message. Do not use as a programmatic contract.
            requestId:
              type: string
              description: Non-personal request correlation identifier.
            details:
              nullable: true
              type: object
              description: Optional safe structured correction information.
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - display_name
    Identifier:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        kind:
          enum:
            - EMAIL
            - PHONE
            - EXTERNAL
          type: string
        value:
          type: string
        verified_at:
          type: string
          format: date-time
          nullable: true
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        token_version:
          type: integer
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        created_by_person_id:
          type: string
          format: uuid
    Membership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - REVOKED
        capabilities:
          type: array
          items:
            type: string
    Capability:
      type: object
      properties:
        code:
          type: string
        description:
          type: string
    Grant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        membership_id:
          type: string
          format: uuid
        capability_code:
          type: string
        resource_id:
          type: string
          format: uuid
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
    Context:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        store_name:
          type: string
        capabilities:
          type: array
          items:
            type: string
    Identity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        profile_type:
          type: string
          deprecated: true
          description: Dica legada de apresentação. Não autoriza recursos.
        wardrobe_plan:
          type: string
        contexts:
          type: array
          items:
            $ref: "#/components/schemas/Context"
      required:
        - id
        - person_id
        - contexts
    Session:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/Identity"
      required:
        - token
        - user
    Registration:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 72
          description: Máximo de 72 bytes UTF-8.
        profileType:
          type: string
          enum:
            - PERSON
            - STORE
          default: PERSON
          deprecated: true
          description: Onboarding legado. Todos são Person; STORE cria organização e
            membership. Não é papel global.
        store:
          type: object
          properties:
            storeName:
              type: string
            cnpj:
              type: string
            description:
              type: string
            socialLinks:
              type: object
          required:
            - storeName
      required:
        - name
        - email
        - password
    Store:
      type: object
      properties:
        id:
          type: string
          format: uuid
        store_name:
          type: string
        description:
          type: string
          nullable: true
        banner_url:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true
        social_links:
          type: object
        created_at:
          type: string
          format: date-time
    StoreDashboard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        store_name:
          type: string
        pieces:
          type: integer
        followers:
          type: integer
        saves:
          type: integer
    StoreRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - DRAFT
            - PENDING_REVIEW
            - ACTIVE
            - SUSPENDED
            - REJECTED
        created_at:
          type: string
          format: date-time
    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        color:
          type: string
          nullable: true
        sizes:
          type: array
          items:
            type: string
        price:
          type: string
          nullable: true
          description: Numeric PostgreSQL serializado como string.
        purchase_link:
          type: string
          nullable: true
        kind:
          type: string
          enum:
            - COMMERCIAL_PREVIEW
        image_urls:
          type: array
          items:
            type: string
      required:
        - id
        - store_id
        - kind
    ProductInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        category:
          type: string
          maxLength: 80
        color:
          type: string
        sizes:
          type: string
          description: Tamanhos separados por vírgula.
        price:
          type: number
          minimum: 0
        purchaseLink:
          type: string
          format: uri
          description: Somente HTTPS.
      required:
        - name
        - category
    OwnershipEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        source:
          type: string
          enum:
            - MANUAL_CATALOG
            - REAL_CAPTURE
            - VERIFIED_PURCHASE
            - VALIDATED_IMPORT
        recorded_by_person_id:
          type: string
          format: uuid
        attested_at:
          type: string
          format: date-time
        evidence_media_id:
          type: string
          format: uuid
          nullable: true
    WardrobeInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
        category:
          type: string
          maxLength: 80
        color:
          type: string
        sizes:
          type: string
        ownershipSource:
          type: string
          enum:
            - MANUAL_CATALOG
            - REAL_CAPTURE
        ownershipAttested:
          type: boolean
          enum:
            - true
          description: Declaração explícita de catalogação de peça possuída. REAL_CAPTURE
            exige foto.
      required:
        - name
        - category
        - ownershipSource
        - ownershipAttested
    WardrobeItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        ownership_event_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - OWNED_ITEM
        name:
          type: string
        category:
          type: string
        color:
          type: string
          nullable: true
        sizes:
          type: array
          items:
            type: string
        image_urls:
          type: array
          items:
            type: string
      required:
        - id
        - person_id
        - ownership_event_id
        - kind
    CommercialSavedItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - COMMERCIAL_PREVIEW
            - SPONSORED_PREVIEW
        created_at:
          type: string
          format: date-time
      required:
        - id
        - product_id
        - kind
    SaveInput:
      type: object
      properties:
        kind:
          type: string
          enum:
            - COMMERCIAL_PREVIEW
            - SPONSORED_PREVIEW
          default: COMMERCIAL_PREVIEW
    LookItem:
      oneOf:
        - type: object
          properties:
            kind:
              type: string
              enum:
                - OWNED_ITEM
            wardrobeItemId:
              type: string
              format: uuid
          required:
            - kind
            - wardrobeItemId
        - type: object
          properties:
            kind:
              type: string
              enum:
                - COMMERCIAL_PREVIEW
                - SPONSORED_PREVIEW
            productId:
              type: string
              format: uuid
          required:
            - kind
            - productId
    LookInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 160
        items:
          type: array
          items:
            $ref: "#/components/schemas/LookItem"
          minItems: 1
          maxItems: 30
      required:
        - title
        - items
    LookVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        items:
          type: array
          items:
            $ref: "#/components/schemas/LookItem"
    Look:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        title:
          type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/LookVersion"
    LookCreated:
      type: object
      properties:
        id:
          type: string
          format: uuid
        versionId:
          type: string
          format: uuid
        version:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/LookItem"
    LookVariationInput:
      type: object
      properties:
        sourceLookVersionId:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 160
      required:
        - sourceLookVersionId
    LookVariationCreated:
      type: object
      required:
        - variationId
        - sourceLookId
        - sourceLookVersionId
        - resultingLookId
        - resultingLookVersionId
      properties:
        variationId:
          type: string
          format: uuid
        sourceLookId:
          type: string
          format: uuid
        sourceLookVersionId:
          type: string
          format: uuid
        resultingLookId:
          type: string
          format: uuid
        resultingLookVersionId:
          type: string
          format: uuid
    LookVariation:
      type: object
      required:
        - variationId
        - sourceLookId
        - sourceLookVersionId
        - resultingLookId
        - createdAt
      properties:
        variationId:
          type: string
          format: uuid
        name:
          type: string
          nullable: true
        sourceLookId:
          type: string
          format: uuid
        sourceLookVersionId:
          type: string
          format: uuid
        resultingLookId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    PersonalContextInput:
      type: object
      properties:
        occasion:
          type: string
          maxLength: 160
          nullable: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        locationText:
          type: string
          maxLength: 500
          nullable: true
        climateReference:
          type: string
          maxLength: 500
          nullable: true
        formality:
          type: string
          maxLength: 80
          nullable: true
        objective:
          type: string
          maxLength: 500
          nullable: true
        notes:
          type: string
          maxLength: 5000
          nullable: true
        provenance:
          type: string
          enum: [USER_DECLARED, IMAGE_INFERRED, SYSTEM_ESTIMATED, MERCHANT_DECLARED, EXPERT_VALIDATED]
    PersonalContext:
      allOf:
        - $ref: "#/components/schemas/PersonalContextInput"
        - type: object
          required: [id, provenance, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    LookContextLink:
      type: object
      required: [lookId, contextId, linkedAt]
      properties:
        lookId:
          type: string
          format: uuid
        contextId:
          type: string
          format: uuid
        linkedAt:
          type: string
          format: date-time
    CollectionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 2000
          nullable: true
    Collection:
      allOf:
        - $ref: "#/components/schemas/CollectionInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    CollectionLookLink:
      type: object
      required: [collectionId, lookId, linkedAt]
      properties:
        collectionId:
          type: string
          format: uuid
        lookId:
          type: string
          format: uuid
        linkedAt:
          type: string
          format: date-time
    ComparisonInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
          nullable: true
    Comparison:
      allOf:
        - $ref: "#/components/schemas/ComparisonInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    ComparisonEvaluationInput:
      type: object
      required: [origin]
      properties:
        contextId:
          type: string
          format: uuid
        origin:
          type: string
          enum: [USER, SYSTEM]
    ComparisonEvaluation:
      allOf:
        - $ref: "#/components/schemas/ComparisonEvaluationInput"
        - type: object
          required: [id, comparisonId, status, createdAt]
          properties:
            id:
              type: string
              format: uuid
            comparisonId:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT]
            createdAt:
              type: string
              format: date-time
    ComparisonEvaluationCriterionInput:
      type: object
      required: [criterionKey, position]
      properties:
        criterionKey:
          type: string
          minLength: 1
          maxLength: 160
        criterionLabel:
          type: string
          maxLength: 160
          nullable: true
        position:
          type: integer
          minimum: 0
    ComparisonEvaluationCriterion:
      allOf:
        - $ref: "#/components/schemas/ComparisonEvaluationCriterionInput"
        - type: object
          required: [id, evaluationId, createdAt]
          properties:
            id:
              type: string
              format: uuid
            evaluationId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    ComparisonEvaluationResultInput:
      type: object
      required: [criterionId, lookId, lookVersionId]
      properties:
        criterionId:
          type: string
          format: uuid
        lookId:
          type: string
          format: uuid
        lookVersionId:
          type: string
          format: uuid
        value:
          type: string
          maxLength: 500
          nullable: true
        note:
          type: string
          maxLength: 5000
          nullable: true
    ComparisonEvaluationResult:
      allOf:
        - $ref: "#/components/schemas/ComparisonEvaluationResultInput"
        - type: object
          required: [evaluationId, createdAt]
          properties:
            evaluationId:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
    ComparisonEvaluationDetail:
      allOf:
        - $ref: "#/components/schemas/ComparisonEvaluation"
        - type: object
          required: [criteria, results]
          properties:
            criteria:
              type: array
              items:
                type: object
                required: [id, criterionKey, position, createdAt]
                properties:
                  id:
                    type: string
                    format: uuid
                  criterionKey:
                    type: string
                  criterionLabel:
                    type: string
                    nullable: true
                  position:
                    type: integer
                    minimum: 0
                  createdAt:
                    type: string
                    format: date-time
    ImparAnalysisInput:
      type: object
      required: [lookId, lookVersionId, contextId]
      properties:
        lookId:
          type: string
          format: uuid
        lookVersionId:
          type: string
          format: uuid
        contextId:
          type: string
          format: uuid
    ImparAnalysis:
      allOf:
        - $ref: "#/components/schemas/ImparAnalysisInput"
        - type: object
          required: [id, status, finalResultId, createdAt]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, COMPLETED]
            origin:
              type: string
              nullable: true
              description: Opaque institutional origin when assigned; absent for newly requested Analyses.
            finalResultId:
              type: string
              format: uuid
              nullable: true
            createdAt:
              type: string
              format: date-time
            methodologyVersionRef:
              type: string
              nullable: true
              description: Opaque methodology version reference assigned by institutional execution when available.
            results:
              type: array
              items:
                type: object
                required: [criterionId, lookId, lookVersionId, createdAt]
                properties:
                  criterionId:
                    type: string
                    format: uuid
                  lookId:
                    type: string
                    format: uuid
                  lookVersionId:
                    type: string
                    format: uuid
                  value:
                    type: string
                    nullable: true
                  note:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                    format: date-time
    ComparisonLookLinkInput:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          minimum: 0
    ComparisonLookLink:
      type: object
      required: [comparisonId, lookId, position, linkedAt]
      properties:
        comparisonId:
          type: string
          format: uuid
        lookId:
          type: string
          format: uuid
        position:
          type: integer
          minimum: 0
        linkedAt:
          type: string
          format: date-time
    ComparisonLook:
      type: object
      required: [position, id, title, created_at]
      properties:
        position:
          type: integer
          minimum: 0
        id:
          type: string
          format: uuid
        title:
          type: string
        created_at:
          type: string
          format: date-time
    Profile:
      type: object
      properties:
        personId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        profilePhotoUrl:
          type: string
          nullable: true
          description: Rota privada /api/media/{id}. Exige Authorization no fetch.
        age:
          type: integer
          nullable: true
        profession:
          type: string
          nullable: true
        bodyShape:
          type: string
          nullable: true
        hairStyle:
          type: string
          nullable: true
        mannequinTop:
          type: string
          nullable: true
        mannequinBottom:
          type: string
          nullable: true
        bust:
          type: string
          nullable: true
        waist:
          type: string
          nullable: true
        hips:
          type: string
          nullable: true
        height:
          type: string
          nullable: true
        avatarConfig:
          type: object
    ProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        age:
          type: integer
          minimum: 13
          maximum: 120
          nullable: true
        profession:
          type: string
          maxLength: 160
          nullable: true
        bodyShape:
          type: string
          nullable: true
          enum:
            - Ampulheta
            - Triângulo
            - Triângulo invertido
            - Retângulo
            - Oval
            - null
        hairStyle:
          type: string
          nullable: true
          enum:
            - Curto
            - Longo
            - Cacheado
            - Coque
            - null
        mannequinTop:
          type: string
          nullable: true
        mannequinBottom:
          type: string
          nullable: true
        bust:
          type: number
          nullable: true
          minimum: 0
          maximum: 300
        waist:
          type: number
          nullable: true
          minimum: 0
          maximum: 300
        hips:
          type: number
          nullable: true
          minimum: 0
          maximum: 300
        height:
          type: number
          nullable: true
          minimum: 80
          maximum: 250
    Capacity:
      type: object
      properties:
        plan:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            limit:
              type: integer
        used:
          type: integer
        limit:
          type: integer
        available:
          type: integer
        isFull:
          type: boolean
        percentage:
          type: integer
        plans:
          type: array
          items:
            type: object
    ShowcaseInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          nullable: true
        itemIds:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 100
          uniqueItems: true
        startsAt:
          type: string
          format: date-time
          nullable: true
        endsAt:
          type: string
          format: date-time
          nullable: true
      required:
        - title
    Showcase:
      type: object
      properties:
        id:
          type: string
          format: uuid
        store_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        item_ids:
          type: array
          items:
            type: string
            format: uuid
    MediaAccess:
      type: object
      properties:
        url:
          type: string
        requiresAuthorization:
          type: boolean
        expiresIn:
          type: integer
          nullable: true
      required:
        - url
        - requiresAuthorization
    ReconstructionJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        person_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - CAPTURED
            - VALIDATING
            - QUEUED
            - PROCESSING
            - QUALITY_CHECK
            - READY
            - NEEDS_MORE_INPUT
            - FAILED
        category: &a1
          type: string
          enum:
            - TOP
            - PANTS
            - DRESS
            - FOOTWEAR
            - BAG
            - ACCESSORY
        pipeline_version:
          type: string
        metrics:
          type: object
        quality:
          type: object
        inputs:
          type: array
          items:
            type: object
        output:
          type: object
          nullable: true
